services:
  postgres:
    image: postgres:17-alpine
    container_name: ipayment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipayment
      POSTGRES_PASSWORD: ipayment_dev
      POSTGRES_DB: ipayment
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipayment -d ipayment"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: ipayment-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web

volumes:
  pgdata: